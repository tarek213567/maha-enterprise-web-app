name = "maha-enterprise"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets serving the production web build
[assets]
directory = "../dist"
binding = "ASSETS"

# Cloudflare D1 (SQLite Edge Database)
[[d1_databases]]
binding = "DB"
database_name = "maha-enterprise-db"
database_id = "25eaf05d-93a6-4011-9f80-336b854725ac"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Maha Enterprise"
VERSION = "1.5.0 PRO"

# Custom Domain Configuration:
# To bind to maha.nexobd.pro:
# Option 1: Cloudflare Dashboard > Workers & Pages > maha-enterprise > Settings > Domains & Routes > Add Custom Domain: maha.nexobd.pro
# Option 2:
# routes = [
#   { pattern = "maha.nexobd.pro/*", zone_name = "nexobd.pro" }
# ]
