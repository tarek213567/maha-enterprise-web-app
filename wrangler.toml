name = "maha-enterprise"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "maha.nexobd.pro/*", zone_name = "nexobd.pro" }
]

# Cloudflare Workers Static Assets serving the production web build
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 (SQLite Edge Database)
[[d1_databases]]
binding = "DB"
database_name = "maha-enterprise-db"
database_id = "25eaf05d-93a6-4011-9f80-336b854725ac"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Maha Enterprise"
VERSION = "1.5.0 PRO"
TELEGRAM_BOT_TOKEN = "9038319945:AAFFZJoJvHaHdrhOuVP3QeEKKRjyFDx72Bk"
TELEGRAM_CHAT_ID = "1904683489"

# Automatic Twice-Daily Backups (1:00 PM and 7:00 PM Bangladesh Time UTC+6 = 07:00 and 13:00 UTC)
[triggers]
crons = ["0 7 * * *", "0 13 * * *"]
