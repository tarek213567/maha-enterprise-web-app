<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="মাহা এন্টারপ্রাইজ" />
    <meta name="theme-color" content="#070b14" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>মাহা এন্টারপ্রাইজ - শস্য আড়ত ও পাইকারি ব্যবসা ব্যবস্থাপনা</title>
    <!-- Embedded offline fallback font families -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div id="pre-mount-splash" style="min-height: 100vh; width: 100%; background: #0B0F19; color: #F1F5F9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
        <div style="width: 52px; height: 52px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10B981; border-radius: 50%; animation: preSpin 0.75s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 19px; font-weight: 700; color: #F8FAFC; letter-spacing: -0.3px;">মাহা এন্টারপ্রাইজ</div>
        <div style="font-size: 13px; color: #94A3B8; margin-top: 5px;">শস্য আড়ত ও পাইকারি ব্যবসা ব্যবস্থাপনা</div>
        <div id="pre-mount-status" style="font-size: 11px; color: #64748B; margin-top: 15px; font-family: monospace;">সফটওয়্যার প্রস্তুত হচ্ছে...</div>
        <div id="pre-mount-actions" style="display: none; margin-top: 24px; gap: 10px;">
          <button onclick="window.location.reload()" style="background: #059669; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">উইন্ডো রিলোড</button>
          <button onclick="if(window.api?.system?.relaunch){window.api.system.relaunch();}else{window.location.reload();}" style="background: #374151; color: white; border: 1px solid #4B5563; padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">অ্যাপ রিস্টার্ট</button>
        </div>
      </div>
      <style>
        @keyframes preSpin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var splash = document.getElementById('pre-mount-splash');
          if (splash && document.getElementById('root')?.contains(splash)) {
            var st = document.getElementById('pre-mount-status');
            if (st) st.innerHTML = '<span style="color:#F87171">লোডিং হতে অতিরিক্ত সময় নিচ্ছে। নিচের বাটনে ক্লিক করুন:</span>';
            var ac = document.getElementById('pre-mount-actions');
            if (ac) ac.style.display = 'flex';
          }
        }, 6000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
